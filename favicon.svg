<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Space Core -->
    <radialGradient id="bgObsidian" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#121b33"/>
      <stop offset="45%" stop-color="#070b18"/>
      <stop offset="85%" stop-color="#020408"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <!-- Cosmic Aurora Core Glow -->
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.38"/>
      <stop offset="30%" stop-color="#4FACFE" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Rim Gradients (Illuminated 10:30 to 4:30) -->
    <linearGradient id="goldRim" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="65%" stop-color="#FFA000"/>
      <stop offset="90%" stop-color="#B26A00"/>
      <stop offset="100%" stop-color="#5D3400"/>
    </linearGradient>

    <!-- Coherent 10:30 Light Source: Specular Titanium Platinum Gold -->
    <linearGradient id="specularGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFFDE7"/>
      <stop offset="55%" stop-color="#FFF176"/>
      <stop offset="85%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>

    <!-- Coherent 10:30 Light Source: Medium Lit Warm Gold -->
    <linearGradient id="mediumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="45%" stop-color="#FFCA28"/>
      <stop offset="80%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Coherent 10:30 Light Source: Deep Bronze Burnished Shadow -->
    <linearGradient id="shadowGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="35%" stop-color="#C59B27"/>
      <stop offset="70%" stop-color="#8D6E1A"/>
      <stop offset="100%" stop-color="#4E340E"/>
    </linearGradient>

    <!-- Diagonal Highlight & Shadow Gradients -->
    <linearGradient id="diagLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>

    <linearGradient id="diagShad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B28921"/>
      <stop offset="65%" stop-color="#6E4A0C"/>
      <stop offset="100%" stop-color="#362204"/>
    </linearGradient>

    <!-- Relativistic Spacetime Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="1"/>
      <stop offset="25%" stop-color="#4FACFE" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#FFE082" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#FFD54F" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFF9C4" stop-opacity="1"/>
    </linearGradient>

    <!-- Singularity Radiant Flare -->
    <radialGradient id="coreFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFFDE7" stop-opacity="1"/>
      <stop offset="45%" stop-color="#FFD54F" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#FFA000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Obsidian Shield Base with Dual-Tone Rim -->
  <circle cx="256" cy="256" r="238" fill="url(#bgObsidian)" stroke="url(#goldRim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="234" fill="url(#auroraGlow)"/>

  <!-- 2. Concentric Astrolabe Chrono-Rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFD54F" stroke-width="1.8" stroke-opacity="0.35" stroke-dasharray="3 7"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#FFE082" stroke-width="1" stroke-opacity="0.3"/>

  <!-- 3. Tilted Spacetime Gravitational Accretion Orbit (-28 deg) -->
  <ellipse cx="256" cy="256" rx="206" ry="68" transform="rotate(-28 256 256)" fill="none" stroke="url(#orbitGrad)" stroke-width="5"/>
  <!-- Orbital Planetary Transit Nodes -->
  <circle cx="86" cy="162" r="5.5" fill="#00F2FE"/>
  <circle cx="86" cy="162" r="10" fill="none" stroke="#00F2FE" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="426" cy="350" r="6" fill="#FFF9C4"/>
  <circle cx="426" cy="350" r="11" fill="none" stroke="#FFD54F" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- 4. Secondary 45-degree Diagonal Rays -->
  <!-- NW Ray (Directly facing 10:30 light) -->
  <polygon points="256,256 244,268 148,148" fill="url(#specularGold)"/>
  <polygon points="256,256 148,148 268,244" fill="url(#mediumGold)"/>

  <!-- NE Ray (Top lit, bottom shadow) -->
  <polygon points="256,256 244,244 364,148" fill="url(#mediumGold)"/>
  <polygon points="256,256 364,148 268,268" fill="url(#shadowGold)"/>

  <!-- SW Ray (Top lit, bottom shadow) -->
  <polygon points="256,256 244,244 148,364" fill="url(#mediumGold)"/>
  <polygon points="256,256 148,364 268,268" fill="url(#shadowGold)"/>

  <!-- SE Ray (Directly in shadow of 10:30 light) -->
  <polygon points="256,256 268,244 364,364" fill="url(#shadowGold)"/>
  <polygon points="256,256 364,364 244,268" fill="url(#diagShad)"/>

  <!-- 5. Primary Cardinal Celestial Nova Rays (3D Faceted Chiaroscuro) -->
  <!-- North Ray: Left = Facing 10:30 light (Specular), Right = Shadow -->
  <polygon points="256,256 226,256 256,48" fill="url(#specularGold)"/>
  <polygon points="256,256 256,48 286,256" fill="url(#shadowGold)"/>

  <!-- West Ray: Top = Facing 10:30 light (Specular), Bottom = Shadow -->
  <polygon points="256,256 256,226 48,256" fill="url(#specularGold)"/>
  <polygon points="256,256 48,256 256,286" fill="url(#shadowGold)"/>

  <!-- East Ray: Top = Facing 10:30 light (Medium Lit), Bottom = Shadow -->
  <polygon points="256,256 256,226 464,256" fill="url(#mediumGold)"/>
  <polygon points="256,256 464,256 256,286" fill="url(#shadowGold)"/>

  <!-- South Ray: Left = Facing 10:30 light (Medium Lit), Right = Shadow -->
  <polygon points="256,256 226,256 256,464" fill="url(#mediumGold)"/>
  <polygon points="256,256 256,464 286,256" fill="url(#shadowGold)"/>

  <!-- 6. Central Singularity Core Aura -->
  <circle cx="256" cy="256" r="64" fill="url(#coreFlare)"/>

  <!-- 7. Central Faceted Diamond Chrono-Crystal (Coherent 10:30 lighting) -->
  <!-- Top-Left Facet (Facing Light) -->
  <polygon points="256,218 256,256 224,256" fill="#FFFFFF"/>
  <!-- Top-Right Facet (Specular/Mid) -->
  <polygon points="256,218 288,256 256,256" fill="#FFF9C4"/>
  <!-- Bottom-Left Facet (Mid) -->
  <polygon points="256,294 224,256 256,256" fill="#FFCA28"/>
  <!-- Bottom-Right Facet (Shadow) -->
  <polygon points="256,294 256,256 288,256" fill="#D4AF37"/>

  <!-- 8. Luminous Singularity Point Spark -->
  <circle cx="256" cy="256" r="7" fill="#FFFFFF"/>
</svg>