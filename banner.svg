<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-nebula" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f1d38" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#070c18" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#020408" stop-opacity="1" />
    </radialGradient>

    <!-- Starfield Grid Pattern -->
    <pattern id="celestial-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="48" cy="48" r="1.2" fill="#38bdf8" fill-opacity="0.45" />
    </pattern>

    <!-- 3D Gold Crystalline Facet Gradients for 2027 -->
    <!-- Top Face: Brilliant Champagne Highlight -->
    <linearGradient id="gold-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Front Face: Radiant Royal Gold -->
    <linearGradient id="gold-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Side Face: Deep Isometric Extrusion Bronze-Amber -->
    <linearGradient id="gold-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="50%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Quantum Laser EKG Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Volumetric Glow Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laser-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Status Pill Glass Gradients -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.18; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.08); }
      }
      @keyframes laserDash {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes float3D {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .anim-glow { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
      .anim-laser { stroke-dasharray: 300 900; animation: laserDash 5s linear infinite; }
      .anim-dot { transform-origin: 472px 42px; animation: blinkDot 1.8s ease-in-out infinite; }
      .anim-digits { animation: float3D 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. VIEWPORT BASE & ATMOSPHERE                                -->
  <!-- ============================================================ -->
  <rect width="1200" height="380" fill="url(#bg-nebula)" />
  <rect width="1200" height="380" fill="url(#celestial-grid)" />

  <!-- Dual Ambient Gaussian Nebulae Orbs -->
  <circle cx="360" cy="180" r="220" fill="#0284c7" class="anim-glow" filter="url(#neon-glow)" />
  <circle cx="840" cy="180" r="200" fill="#d97706" class="anim-glow" filter="url(#neon-glow)" style="animation-delay: -3s;" />
  <circle cx="600" cy="200" r="160" fill="#10b981" opacity="0.12" filter="url(#neon-glow)" />

  <!-- Concentric Astrolabe Coordinate Rings behind Numerals -->
  <g opacity="0.22" transform="translate(600, 195)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 8" />
    <circle cx="0" cy="0" r="205" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3 9" />
    <circle cx="0" cy="0" r="250" fill="none" stroke="#10b981" stroke-width="0.5" />
  </g>

  <!-- ============================================================ -->
  <!-- 2. STATUS PILL BADGE: 2027 MULTIVERSE ODYSSEY                -->
  <!-- ============================================================ -->
  <g transform="translate(600, 42)">
    <!-- Pill Container -->
    <rect x="-145" y="-14" width="290" height="28" rx="14" 
          fill="url(#pill-bg)" stroke="url(#pill-border)" stroke-width="1.2" />
    <!-- Pulsing Luminous Indicator Dot -->
    <circle cx="-120" cy="0" r="4.5" fill="#fbbf24" class="anim-dot" filter="url(#laser-glow)" />
    <!-- Pill Text -->
    <text x="6" y="4.5" text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" 
          font-size="10.5" font-weight="700" letter-spacing="2.5" fill="#f8fafc">
      2027 MULTIVERSE ODYSSEY
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- 3. EDITORIAL SERIF HEADER: "HAPPY NEW YEAR"                  -->
  <!-- ============================================================ -->
  <text x="600" y="108" text-anchor="middle" 
        font-family="'Cinzel', 'Times New Roman', Georgia, serif" 
        font-size="28" font-weight="800" letter-spacing="12" fill="url(#gold-top)" filter="url(#laser-glow)">
    HAPPY NEW YEAR
  </text>

  <!-- ============================================================ -->
  <!-- 4. 3D ISOMETRIC EXTRUDED NUMERALS: "2 0 2 7"                 -->
  <!-- ============================================================ -->
  <!-- Digits horizontally centered at x: 280, 450, 620, 790        -->
  <g class="anim-digits" id="isometric-2027">

    <!-- ==================== DIGIT 1: '2' ==================== -->
    <g transform="translate(260, 130)">
      <!-- Top Bevel Highlight (Top Bar) -->
      <polygon points="0,0 16,-16 104,-16 88,0" fill="url(#gold-top)" stroke="#713f12" stroke-width="1.2" />
      <!-- Mid Step Top Bevel -->
      <polygon points="0,80 16,64 104,64 88,80" fill="url(#gold-top)" stroke="#713f12" stroke-width="1.2" />
      <!-- Right Side Extrusions -->
      <polygon points="88,0 104,-16 104,24 88,40" fill="url(#gold-side)" stroke="#713f12" stroke-width="1.2" />
      <polygon points="88,80 104,64 104,88 88,104" fill="url(#gold-side)" stroke="#713f12" stroke-width="1.2" />
      <!-- Front Face '2' (Block Isometric) -->
      <path d="M 0 0 L 88 0 L 88 36 L 28 36 L 28 50 L 88 50 L 88 104 L 0 104 L 0 68 L 60 68 L 60 36 L 0 36 Z" 
            fill="url(#gold-front)" stroke="#713f12" stroke-width="1.5" />
    </g>

    <!-- ==================== DIGIT 2: '0' ==================== -->
    <g transform="translate(435, 130)">
      <!-- Top Bevel Highlight -->
      <polygon points="0,0 16,-16 104,-16 88,0" fill="url(#gold-top)" stroke="#713f12" stroke-width="1.2" />
      <polygon points="28,72 44,56 76,56 60,72" fill="url(#gold-top)" stroke="#713f12" stroke-width="1" />
      <!-- Right Side Extrusions -->
      <polygon points="88,0 104,-16 104,88 88,104" fill="url(#gold-side)" stroke="#713f12" stroke-width="1.2" />
      <polygon points="28,32 44,16 44,88 28,104" fill="url(#gold-side)" opacity="0.6" stroke="#713f12" stroke-width="1" />
      <!-- Front Face '0' -->
      <path d="M 0 0 L 88 0 L 88 104 L 0 104 Z M 28 32 L 60 32 L 60 72 L 28 72 Z" 
            fill-rule="evenodd" fill="url(#gold-front)" stroke="#713f12" stroke-width="1.5" />
    </g>

    <!-- ==================== DIGIT 3: '2' ==================== -->
    <g transform="translate(610, 130)">
      <!-- Top Bevel Highlight (Top Bar) -->
      <polygon points="0,0 16,-16 104,-16 88,0" fill="url(#gold-top)" stroke="#713f12" stroke-width="1.2" />
      <!-- Mid Step Top Bevel -->
      <polygon points="0,80 16,64 104,64 88,80" fill="url(#gold-top)" stroke="#713f12" stroke-width="1.2" />
      <!-- Right Side Extrusions -->
      <polygon points="88,0 104,-16 104,24 88,40" fill="url(#gold-side)" stroke="#713f12" stroke-width="1.2" />
      <polygon points="88,80 104,64 104,88 88,104" fill="url(#gold-side)" stroke="#713f12" stroke-width="1.2" />
      <!-- Front Face '2' (Block Isometric) -->
      <path d="M 0 0 L 88 0 L 88 36 L 28 36 L 28 50 L 88 50 L 88 104 L 0 104 L 0 68 L 60 68 L 60 36 L 0 36 Z" 
            fill="url(#gold-front)" stroke="#713f12" stroke-width="1.5" />
    </g>

    <!-- ==================== DIGIT 4: '7' ==================== -->
    <g transform="translate(785, 130)">
      <!-- Top Bevel Highlight -->
      <polygon points="0,0 16,-16 104,-16 88,0" fill="url(#gold-top)" stroke="#713f12" stroke-width="1.2" />
      <!-- Right Side Extrusions -->
      <polygon points="88,0 104,-16 104,88 88,104" fill="url(#gold-side)" stroke="#713f12" stroke-width="1.2" />
      <!-- Front Face '7' -->
      <path d="M 0 0 L 88 0 L 88 104 L 60 104 L 60 36 L 0 36 Z" 
            fill="url(#gold-front)" stroke="#713f12" stroke-width="1.5" />
    </g>

  </g>

  <!-- ============================================================ -->
  <!-- 5. KINETIC QUANTUM LASER EKG / AURORA WAVE                   -->
  <!-- ============================================================ -->
  <g transform="translate(0, 260)">
    <!-- Underlying Neon Glow Path -->
    <path d="M 60 0 L 260 0 L 290 -30 L 320 35 L 350 -45 L 380 40 L 410 -25 L 435 0 L 760 0 L 790 -35 L 820 40 L 850 -25 L 875 0 L 1140 0" 
          fill="none" stroke="#00f2fe" stroke-width="6" opacity="0.3" filter="url(#laser-glow)" />

    <!-- Crisp Dynamic Foreground Pulse -->
    <path d="M 60 0 L 260 0 L 290 -30 L 320 35 L 350 -45 L 380 40 L 410 -25 L 435 0 L 760 0 L 790 -35 L 820 40 L 850 -25 L 875 0 L 1140 0" 
          fill="none" stroke="url(#laser-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="anim-laser" />

    <!-- Quantum Pulse Nodes -->
    <circle cx="350" cy="-45" r="4.5" fill="#ffffff" filter="url(#laser-glow)" />
    <circle cx="350" cy="-45" r="2.5" fill="#fbbf24" />
    <circle cx="320" cy="35" r="3.5" fill="#38bdf8" />
    <circle cx="820" cy="40" r="4" fill="#10b981" filter="url(#laser-glow)" />
    <circle cx="790" cy="-35" r="3.5" fill="#fbbf24" />
  </g>

  <!-- ============================================================ -->
  <!-- 6. EDITORIAL SUBTITLE & MISSION STATEMENT                    -->
  <!-- ============================================================ -->
  <text x="600" y="306" text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" 
        font-size="13" font-weight="700" letter-spacing="5" fill="#94a3b8">
    RELATIVISTIC SPACETIME TUNNEL • AURORA CHRONOMETER • 2D PARTICLE PYROTECHNICS
  </text>

  <text x="600" y="342" text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" 
        font-size="19" font-weight="500" fill="#f8fafc">
    Step across the cosmic event horizon into <tspan fill="#facc15" font-weight="700">2027</tspan> with browser-native 60fps WebGL.
  </text>
</svg>