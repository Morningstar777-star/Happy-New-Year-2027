<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Happy New Year 2027">
  <defs>
    <!-- Sky background gradient -->
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020308"/>
      <stop offset="40%" stop-color="#060b1a"/>
      <stop offset="100%" stop-color="#0a0415"/>
    </linearGradient>

    <!-- Title gold gradient (top-lit) -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="15%"  stop-color="#FFF9C4"/>
      <stop offset="45%"  stop-color="#FFD54F"/>
      <stop offset="75%"  stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Extrude dark side gradient -->
    <linearGradient id="goldExtrude" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#6D3800"/>
      <stop offset="50%"  stop-color="#3D1F00"/>
      <stop offset="100%" stop-color="#1A0900"/>
    </linearGradient>

    <!-- Year number gradient (cyan-cold cosmic) -->
    <linearGradient id="yearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="20%"  stop-color="#E0F7FA"/>
      <stop offset="50%"  stop-color="#00E5FF"/>
      <stop offset="80%"  stop-color="#0097A7"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>

    <!-- Year extrude gradient -->
    <linearGradient id="yearExtrude" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#003740"/>
      <stop offset="100%" stop-color="#001418"/>
    </linearGradient>

    <!-- Aurora glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow only -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orbit glow filter -->
    <filter id="orbitGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star particle shimmer gradient -->
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtitle gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4FACFE" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#A8EDEA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Divider line gradient -->
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFD54F" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#FFD54F" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ─── 1. OBSIDIAN BACKGROUND ─── -->
  <rect width="900" height="280" fill="url(#skyBg)" rx="8"/>

  <!-- ─── 2. STAR FIELD (varied radii, each fading in at different delays) ─── -->
  <!-- Row 1 -->
  <circle cx="42"  cy="18"  r="1.2" fill="#FFF9C4" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.2;0.9;0" dur="4s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="35"  r="0.8" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0;0.7;0" dur="3.1s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="12"  r="1.0" fill="#E0F7FA" opacity="0">
    <animate attributeName="opacity" values="0;1;0.3;1;0" dur="5.2s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="28"  r="0.7" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0;0.8;0" dur="3.7s" begin="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="10"  r="1.3" fill="#FFF176" opacity="0">
    <animate attributeName="opacity" values="0;1;0.4;1;0" dur="4.4s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="590" cy="22"  r="0.9" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0;0.6;0" dur="2.9s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="15"  r="1.1" fill="#E0F7FA" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.2;0.9;0" dur="6.1s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="30"  r="0.8" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0;0.7;0" dur="3.5s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="8"   r="1.0" fill="#FFF9C4" opacity="0">
    <animate attributeName="opacity" values="0;1;0.3;1;0" dur="4.8s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <!-- Row 2 -->
  <circle cx="18"  cy="55"  r="0.7" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0;0.8;0" dur="3.3s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="78"  cy="70"  r="1.2" fill="#FFF176" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.2;0.9;0" dur="5.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="165" cy="60"  r="0.9" fill="#E0F7FA" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0;0.7;0" dur="3.9s" begin="2.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="285" cy="72"  r="1.1" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;1;0.4;1;0" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="55"  r="0.8" fill="#FFF9C4" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0;0.8;0" dur="2.7s" begin="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="835" cy="68"  r="1.3" fill="#E0F7FA" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.2;0.9;0" dur="5.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <!-- Bottom row -->
  <circle cx="55"  cy="240" r="0.9" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0;0.7;0" dur="4.1s" begin="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="255" r="0.7" fill="#FFF176" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0;0.8;0" dur="3.6s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="250" r="1.1" fill="#E0F7FA" opacity="0">
    <animate attributeName="opacity" values="0;1;0.3;1;0" dur="5.0s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="855" cy="242" r="0.8" fill="#FFFFFF" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0;0.6;0" dur="3.2s" begin="1.7s" repeatCount="indefinite"/>
  </circle>

  <!-- ─── 3. ANIMATED ORBITAL RING (background, behind text) ─── -->
  <g transform="translate(450,140)">
    <!-- Outer orbit ring (tilted ellipse, pulsing) -->
    <ellipse rx="390" ry="45" transform="rotate(-8)" fill="none" stroke="#FFD54F" stroke-width="1.5" stroke-opacity="0" stroke-dasharray="6 14">
      <animate attributeName="stroke-opacity" values="0;0.3;0.1;0.3;0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Inner orbit ring, opposite phase -->
    <ellipse rx="370" ry="38" transform="rotate(-8)" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0" stroke-dasharray="3 20">
      <animate attributeName="stroke-opacity" values="0;0.2;0.05;0.2;0" dur="6s" begin="1s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ─── 4. SHOOTING STAR (periodic) ─── -->
  <g>
    <line x1="750" y1="30" x2="850" y2="60" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0;0.9;0" dur="0.6s" begin="3s" repeatCount="indefinite" repeatDur="indefinite"/>
      <animate attributeName="x1" values="750;640" dur="0.6s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="30;65" dur="0.6s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="850;740" dur="0.6s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="60;95" dur="0.6s" begin="3s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="50" x2="260" y2="75" stroke="#FFF9C4" stroke-width="1.2" stroke-opacity="0" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0;0.8;0" dur="0.5s" begin="9.5s" repeatCount="indefinite" repeatDur="indefinite"/>
    </line>
  </g>

  <!-- ─── 5. HEADLINE — "HAPPY NEW YEAR" (bold extrusion style) ─── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze" begin="0.1s"/>

    <!-- Extrusion shadow layer (shifted right+down) -->
    <text x="451" y="121" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-weight="900" font-size="58" letter-spacing="-1"
          text-anchor="middle" fill="url(#goldExtrude)">
      HAPPY NEW YEAR
    </text>
    <text x="452" y="122" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-weight="900" font-size="58" letter-spacing="-1"
          text-anchor="middle" fill="url(#goldExtrude)" opacity="0.5">
      HAPPY NEW YEAR
    </text>

    <!-- Main face of headline -->
    <text x="448" y="118" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-weight="900" font-size="58" letter-spacing="-1"
          text-anchor="middle" fill="url(#goldTop)" filter="url(#glow)">
      HAPPY NEW YEAR
    </text>
  </g>

  <!-- ─── 6. YEAR — "2027" (cyberpunk ice-cyan extrusion) ─── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze" begin="0.4s"/>

    <!-- Extrusion depth layers -->
    <text x="452" y="203" 
          font-family="'Arial Black', 'Impact', sans-serif"
          font-weight="900" font-size="80" letter-spacing="8"
          text-anchor="middle" fill="url(#yearExtrude)">
      2027
    </text>
    <text x="450" y="200"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-weight="900" font-size="80" letter-spacing="8"
          text-anchor="middle" fill="url(#yearExtrude)" opacity="0.6">
      2027
    </text>

    <!-- Main face -->
    <text x="448" y="197"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-weight="900" font-size="80" letter-spacing="8"
          text-anchor="middle" fill="url(#yearGrad)" filter="url(#softGlow)">
      2027
    </text>

    <!-- Year scan line shimmer (a white line that sweeps across once every 5s) -->
    <rect x="200" y="125" width="0" height="72" fill="white" opacity="0.12" rx="1">
      <animate attributeName="width" values="0;500;0" dur="0.4s" begin="2s" repeatCount="indefinite" repeatDur="20s"/>
      <animate attributeName="x" values="200;200;700" dur="0.4s" begin="2s" repeatCount="indefinite" repeatDur="20s"/>
    </rect>
  </g>

  <!-- ─── 7. DIVIDER LINE ─── -->
  <rect x="100" y="213" width="700" height="1.5" fill="url(#divLine)" rx="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8" dur="1s" fill="freeze" begin="0.8s"/>
  </rect>

  <!-- ─── 8. SUBTITLE ─── -->
  <text x="450" y="244"
        font-family="'Trebuchet MS', 'Segoe UI', sans-serif"
        font-size="15" letter-spacing="4"
        text-anchor="middle" fill="url(#subGrad)" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="1.4s" fill="freeze" begin="1s"/>
    3D WEBGL · COSMIC COUNTDOWN · PERSONALIZED WISHES · FIREWORKS
  </text>

  <!-- ─── 9. LIVE BADGE (pill) ─── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze" begin="1.3s"/>
    <!-- Pill bg -->
    <rect x="332" y="257" width="236" height="17" rx="8" fill="#0a1628" stroke="#FFD54F" stroke-width="0.8" stroke-opacity="0.7"/>
    <!-- Pulsing green dot -->
    <circle cx="347" cy="265.5" r="4" fill="#00E676">
      <animate attributeName="r" values="3;4.5;3" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Label -->
    <text x="360" y="269.5"
          font-family="'Trebuchet MS', monospace"
          font-size="10" letter-spacing="1.5"
          fill="#FFE082">LIVE AT yrphappynewyearcoep27.netlify.app</text>
  </g>

  <!-- ─── 10. MINI EMBLEM (top-left corner) ─── -->
  <g transform="translate(44,140)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze" begin="0.5s"/>
    <!-- Shield ring -->
    <circle cx="0" cy="0" r="30" fill="#060b18" stroke="#FFD54F" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Mini nova rays -->
    <polygon points="0,-22 -4,0 0,22 4,0" fill="#FFD54F" opacity="0.9"/>
    <polygon points="-22,0 0,-4 22,0 0,4" fill="#FFD54F" opacity="0.9"/>
    <polygon points="-15,-15 -3,0 15,15 3,0" fill="#FFA000" opacity="0.7"/>
    <polygon points="15,-15 3,0 -15,15 -3,0" fill="#FFA000" opacity="0.7"/>
    <!-- Orbit ellipse -->
    <ellipse rx="26" ry="9" transform="rotate(-28)" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Core -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" filter="url(#softGlow)"/>
    <!-- Rotation animation on emblem -->
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- ─── 11. MINI EMBLEM (top-right corner, counter-rotating) ─── -->
  <g transform="translate(856,140)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze" begin="0.5s"/>
    <circle cx="0" cy="0" r="30" fill="#060b18" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.8"/>
    <polygon points="0,-22 -4,0 0,22 4,0" fill="#00E5FF" opacity="0.8"/>
    <polygon points="-22,0 0,-4 22,0 0,4" fill="#00E5FF" opacity="0.8"/>
    <polygon points="-15,-15 -3,0 15,15 3,0" fill="#0097A7" opacity="0.7"/>
    <polygon points="15,-15 3,0 -15,15 -3,0" fill="#0097A7" opacity="0.7"/>
    <ellipse rx="26" ry="9" transform="rotate(28)" fill="none" stroke="#FFD54F" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#00E5FF" filter="url(#softGlow)"/>
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite" additive="sum"/>
  </g>
</svg>
